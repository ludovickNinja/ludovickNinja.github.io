<p class="tab-description">
  <strong data-i18n="halo.descriptionStrong">Estimates the number of stones in a halo based on the center size.</strong><br>
  <span data-i18n-html="halo.descriptionBody">Enter the <em>center stone shape, dimensions</em> and <em>halo stone size</em> to calculate an <u>even</u> count that fits the halo circumference.</span>
</p>

<div class="halo-calculator">
  <div class="input-section">
    <label for="center-shape-halo" data-i18n="halo.shapeLabel">Select Center Stone Shape:</label>
    <select id="center-shape-halo">
      <option value="round" data-i18n="halo.shapeRound">Round</option>
      <option value="oval" data-i18n="halo.shapeOval">Oval</option>
      <option value="cushion" data-i18n="halo.shapeCushion">Cushion</option>
      <option value="princess" data-i18n="halo.shapePrincess">Princess</option>
      <option value="emerald" data-i18n="halo.shapeEmerald">Emerald</option>
      <option value="pear" data-i18n="halo.shapePear">Pear</option>
      <option value="marquise" data-i18n="halo.shapeMarquise">Marquise</option>
    </select>

    <label for="width-halo" data-i18n="halo.widthLabel">Width of Center Stone (mm):</label>
    <input type="number" id="width-halo" placeholder="e.g., 5.00" min="0" step="0.01" />

    <label for="length-halo" id="length-label-halo" style="display: none;" data-i18n="halo.lengthLabel">Length of Center Stone (mm):</label>
    <input type="number" id="length-halo" placeholder="e.g., 7.00" style="display: none;" min="0" step="0.01" />

    <label for="spacing-to-center" data-i18n="halo.spacingToCenterLabel">Spacing to Center Stone (mm):</label>
    <input type="number" id="spacing-to-center" value="0.2" placeholder="0.2" min="0" step="0.01" />

    <label for="melee-diameter-halo" data-i18n="halo.meleeDiameterLabel">Diameter of Melee Stones (mm):</label>
    <input type="number" id="melee-diameter-halo" placeholder="e.g., 1.50" min="0" step="0.01" />

    <label for="spacing-between-melees-halo" data-i18n="halo.spacingBetweenLabel">Spacing Between Melees (mm):</label>
    <input type="number" id="spacing-between-melees-halo" value="0.2" placeholder="0.2" min="0" step="0.01" />
  </div>

  <div class="output-section">
    <label for="total-stones-halo" data-i18n="halo.totalStonesLabel">Total Stones Needed:</label>
    <input type="text" id="total-stones-halo" readonly placeholder="0" />
  </div>
</div>
